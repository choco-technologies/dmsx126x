; LILYGO T-Deck Pro: the SX1262 LoRa radio (the vendor's examples: CS = GPIO3, RESET = GPIO4, BUSY = GPIO6, DIO1 = GPIO5, power = GPIO46).
;
; The radio is on the bus of the e-paper (GP-SPI2) and joins its friends_group (epd): the transfers go through the node of the bus with the chip
; select of the radio (dmspi_ioctl_cmd_transfer_cs). The pins of the power, of the chip select and of the reset are already the sections
; [lora_power], [lora_cs], [lora_reset] of the display's ini (display.ini of dmuc8253: the radio must be powered and deselected from the start,
; or it loads the lines of the display) - they only need the friend_role of this driver (dmuc8253 >= the version that adds them); here are the
; two inputs and the driver. GPIO0..15 are port A: GPIO5 is PA5, GPIO6 is PA6.
; dmgpio, dmspi and dmuc8253 (its ini) must be loaded; the radio is started when all the friends are there.

[lora_busy]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=lora_busy
pin=PA6
mode=input

[lora_dio1]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=lora_dio1
pin=PA5
mode=input

; The node is /dev/lora (the name of the section). The modulation is the one of a MeshCore mesh on 868 MHz (EU narrow); a protocol that sets
; its own (DMDRVI_IOCTL_LORA_SET_CONFIG) overrides it. The board has a TCXO of 2.4 V on DIO3 and the antenna switch on DIO2.
[lora]
driver_name=dmsx126x
driver_order=4
friends_group=epd
frequency_hz=869618000
bandwidth_hz=62500
spreading_factor=8
coding_rate=8
tx_power_dbm=14
crc=1
preamble_symbols=16
; (dmini reads decimal: 5156 = 0x1424, the sync word of a private network)
sync_word=5156
tcxo_mv=2400
dio2_rf_switch=1
current_limit_ma=140
